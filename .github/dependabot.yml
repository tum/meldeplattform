# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # PHP dependencies (composer.json / composer.lock)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Bundle the Laravel framework + first-party packages into one PR.
      # Pint is dev tooling and belongs in the group below, but pattern
      # groups win over dependency-type groups, so exclude it explicitly.
      laravel:
        patterns:
          - "laravel/*"
        exclude-patterns:
          - "laravel/pint"
      # Bundle the Symfony components (pulled in transitively) together.
      symfony:
        patterns:
          - "symfony/*"
      # Bundle dev/test tooling together.
      dev-tooling:
        dependency-type: "development"

  # Dockerfile base image (php:8.5-fpm-alpine)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Service images referenced from docker-compose.yml (mariadb, …), which the
  # "docker" ecosystem above does not cover.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions used in the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
